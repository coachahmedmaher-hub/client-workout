<!DOCTYPE html>
<html lang="en" data-g="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0907">
<title>Ahmed Maher Workouts</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=10">
<script>try{var g=localStorage.getItem("amw-g");if(g)document.documentElement.dataset.g=g;}catch(e){}</script>
</head>
<body>
<section class="band">
  <div class="coachpic" aria-hidden="true"><img src="images/coach.jpg" alt="" draggable="false"></div>
  <div class="bar-top">
    <div class="pills">
    </div>
    <div class="langwrap">
      <button type="button" class="pill" id="globe" aria-haspopup="true" aria-expanded="false" aria-controls="langmenu">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3Z"/></svg>
        <span id="langname">English</span>
      </button>
      <div class="langmenu" id="langmenu" role="menu" hidden></div>
    </div>
  </div>
  <div class="band-in">
    <div>
      <span class="role" data-i="role">Coach</span>
      <h1 class="word" dir="ltr"><span class="solid" id="first">AHMED</span><span class="outline" id="last">MAHER</span></h1>
      <p class="tagline" data-i="tagline"></p>
      <div class="contact" id="contact"></div>
    </div>
    <div class="panel">
      <div class="step" id="step1">
        <span class="stepno" data-i="step1">Step 1 of 2</span>
        <h2 data-i="chooseTitle">Who's training today?</h2>
        <p data-i="chooseSub"></p>
        <div class="gpick">
          <button type="button" class="gbtn m" data-gender="m" aria-pressed="false">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><circle cx="20" cy="28" r="12"/><path d="M29 19 41 7M30 7h11v11"/></svg>
            <span data-i="man">Man</span></button>
          <button type="button" class="gbtn f" data-gender="f" aria-pressed="false">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><circle cx="24" cy="18" r="12"/><path d="M24 30v14M17 38h14"/></svg>
            <span data-i="woman">Woman</span></button>
        </div>
      </div>
      <form class="step" id="step2" autocomplete="off">
        <div class="stephead"><span class="stepno" data-i="step2">Step 2 of 2</span><button type="button" class="chg" id="chg"><span id="gicon"></span><span id="gname"></span> · <span data-i="change">Change</span></button></div>
        <h2 data-i="findTitle">Your workout</h2>
        <p data-i="findSub"></p>
        <label for="code" style="position:absolute;left:-9999px" data-i="codeLabel">Client code</label>
        <div class="search" dir="ltr">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7b8592" stroke-width="2" style="align-self:center;margin-left:8px" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="code" placeholder="e.g. HIBA-7K4Q2M" maxlength="40" spellcheck="false" autocapitalize="characters">
          <button type="submit" id="go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span data-i="go">Open my workout</span></button>
        </div>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <div class="legal"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex:none;margin-top:1px"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span id="legal"></span></div>
      </form>
    </div>
  </div>
</section>

<main id="workout" hidden></main>
<footer class="sitefoot"><span id="copy"></span><span data-i="foot2"></span></footer>
<div id="restpill" hidden role="timer" aria-live="off"><span data-i="restLeft">Rest</span><b>1:00</b><button type="button" data-i="skip">Skip</button></div>

<script src="assets/config.js?v=10"></script>
<script src="assets/i18n.js?v=10"></script>
<script src="assets/crypto.js?v=10"></script>
<script src="assets/photos.js?v=10"></script>
<script src="assets/anatomy.js?v=10"></script>
<script src="assets/workout.js?v=10"></script>
<script>
(function () {
  const S = window.SITE, $ = id => document.getElementById(id), T = I18N.t, html = document.documentElement;
  let gender = null, current = null, curId = null, lastMsg = null;
  try { gender = localStorage.getItem("amw-g"); } catch (e) {}
  $("first").textContent = S.coachFirst; $("last").textContent = S.coachLast;

  const ICON = { m: '<svg width="16" height="16" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"><circle cx="20" cy="28" r="12"/><path d="M29 19 41 7M30 7h11v11"/></svg>',
                 f: '<svg width="16" height="16" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"><circle cx="24" cy="18" r="12"/><path d="M24 30v14M17 38h14"/></svg>' };
  function setGender(g, go) {
    gender = g; html.dataset.g = g; try { localStorage.setItem("amw-g", g); } catch (e) {}
    document.querySelector('meta[name="theme-color"]').content = g === "f" ? "#fff6f8" : "#0a0907";
    document.querySelectorAll(".gbtn").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.gender === g)));
    $("gicon").innerHTML = ICON[g]; $("gname").textContent = T(g === "f" ? "woman" : "man");
    if (go) { $("step1").classList.remove("on"); $("step2").classList.add("on"); $("code").focus({ preventScroll: true }); }
    if (current) draw();
  }
  function contact() {
    const a = [];
    if (S.whatsapp) a.push(`<a class="wa" href="https://wa.me/${S.whatsapp.replace(/\D/g, "")}" target="_blank" rel="noopener"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.6-.3Z"/></svg><span>${T("wa")}</span></a>`);
    if (S.instagram) a.push(`<a class="ig" href="https://www.instagram.com/${S.instagram}/" target="_blank" rel="noopener"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg><span dir="ltr">@${S.instagram}</span></a>`);
    $("contact").innerHTML = a.join("");
  }
  function setMsg(kind, key, vars) { lastMsg = [kind, key, vars]; $("msg").className = "msg" + (kind === "ok" ? " ok" : ""); $("msg").textContent = key ? T(key, vars) : ""; }
  function apply() {
    const l = I18N.lang, name = T("coach");
    html.lang = l; html.dir = I18N.dir();
    document.querySelectorAll("[data-i]").forEach(n => n.textContent = T(n.dataset.i));
    $("legal").textContent = T("legal", { name });
    $("copy").textContent = T("foot", { year: new Date().getFullYear(), name });
    $("langname").textContent = I18N.langs[l]._name;
    $("langmenu").innerHTML = I18N.order.map(k => `<button type="button" role="menuitemradio" aria-checked="${k === l}" data-l="${k}" lang="${k}" dir="${I18N.langs[k]._dir}">${I18N.langs[k]._name}${k === l ? " ✓" : ""}</button>`).join("");
    if (gender) $("gname").textContent = T(gender === "f" ? "woman" : "man");
    contact(); if (lastMsg) setMsg(...lastMsg); if (current) draw();
  }
  const menu = $("langmenu"), globe = $("globe");
  const closeMenu = () => { menu.hidden = true; globe.setAttribute("aria-expanded", "false"); };
  globe.addEventListener("click", e => { e.stopPropagation(); const o = menu.hidden; menu.hidden = !o; globe.setAttribute("aria-expanded", String(o)); });
  menu.addEventListener("click", e => { const b = e.target.closest("button[data-l]"); if (!b) return; I18N.set(b.dataset.l); closeMenu(); apply(); });
  document.addEventListener("click", e => { if (!e.target.closest(".langwrap")) closeMenu(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
  document.querySelectorAll(".gbtn").forEach(b => b.addEventListener("click", () => setGender(b.dataset.gender, true)));
  $("chg").addEventListener("click", () => { $("step2").classList.remove("on"); $("step1").classList.add("on"); setMsg("", ""); });
  document.addEventListener("contextmenu", e => { if (e.target.tagName !== "INPUT") e.preventDefault(); });

  function draw() {
    Workout.render($("workout"), current, curId, gender || current.gender || "m", () => {
      current = null; $("workout").hidden = true; $("workout").innerHTML = ""; document.body.classList.remove("inwork"); window.scrollTo({ top: 0 }); });
    $("workout").hidden = false; document.body.classList.add("inwork");
  }
  async function open(code) {
    const c = Vault.normCode(code), btn = $("go");
    if (c.length < 4) { setMsg("", "msgShort"); return; }
    btn.disabled = true; setMsg("ok", "msgChecking");
    try {
      const id = await Vault.reportId(c);
      const res = await fetch("workouts/" + id + ".json", { cache: "no-store" });
      if (!res.ok) throw 0;
      current = await Vault.decryptReport(c, await res.json()); curId = id;
      if (!gender && current.gender) setGender(current.gender, false);
      setMsg("ok", "msgReady", { name: current.client.split(" ")[0] });
      draw(); window.scrollTo({ top: 0 });
    } catch (e) { setMsg("", "msgNotFound"); }
    finally { btn.disabled = false; }
  }
  $("step2").addEventListener("submit", e => { e.preventDefault(); open($("code").value); });

  if (gender) setGender(gender, false);
  $("step1").classList.add("on");
  apply();
})();
</script>
</body>
</html>
